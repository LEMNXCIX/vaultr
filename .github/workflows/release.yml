name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  CARGO_INCREMENTAL: 0

permissions:
  contents: write

jobs:
  # Gate: never cut a release from a tree that does not pass fmt/clippy/test.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  release:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Single-OS matrix for now (Linux x86_64 only).
        # Enable macOS/Windows later by adding entries:
        # - os: macos-latest
        #   target: aarch64-apple-darwin
        # - os: windows-latest
        #   target: x86_64-pc-windows-msvc
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=manual" >> "$GITHUB_ENV"
          fi

      - name: Build (release)
        run: cargo build -p vltr-cli --release --target ${{ matrix.target }}

      - name: Generate completions (bash/zsh/fish)
        run: |
          mkdir -p completions
          ./target/${{ matrix.target }}/release/vltr completions bash > completions/vltr.bash
          ./target/${{ matrix.target }}/release/vltr completions zsh  > completions/_vltr
          ./target/${{ matrix.target }}/release/vltr completions fish > completions/vltr.fish

      - name: Package archive
        run: |
          mkdir -p "dist/vltr-${{ env.VERSION }}-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/vltr" "dist/vltr-${{ env.VERSION }}-${{ matrix.target }}/"
          cp -r completions "dist/vltr-${{ env.VERSION }}-${{ matrix.target }}/"
          cp README.md "dist/vltr-${{ env.VERSION }}-${{ matrix.target }}/"
          tar -czf "dist/vltr-${{ env.VERSION }}-${{ matrix.target }}.tar.gz" -C dist "vltr-${{ env.VERSION }}-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: vltr-${{ env.VERSION }}-${{ matrix.target }}
          path: dist/vltr-${{ env.VERSION }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/vltr-${{ env.VERSION }}-${{ matrix.target }}.tar.gz
          generate_release_notes: true