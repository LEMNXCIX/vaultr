name: Audit

on:
  schedule:
    # Weekly, Monday 03:00 UTC. Dependency advisories are not checked on every
    # PR — local-first flow keeps that feedback in CI releases only.
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Installs and runs `cargo deny check` using deny.toml at the repo root
      # (advisories, licenses, bans).
      - uses: EmbarkStudios/cargo-deny-action@v2