[workspace]
resolver = "2"
members = [
    "crates/models",
    "crates/crypto",
    "crates/storage",
    "crates/core",
    "crates/sync",
    "crates/cli",
    # "apps/desktop",  # se activará en la fase de GPUI
]
default-members = ["crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Your Name <you@example.com>"]
repository = "https://github.com/yourname/secrets-manager"
rust-version = "1.75"

[workspace.dependencies]
# Internal crates
models = { path = "crates/models" }
crypto = { path = "crates/crypto" }
storage = { path = "crates/storage" }
core = { path = "crates/core" }
sync = { path = "crates/sync" }

# Crypto (pinned for Rust 1.75 compatibility)
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
aead = "0.5.2"
hkdf = "0.12.4"
sha2 = "0.10.8"
zeroize = { version = "1.7.0", features = ["derive"] }
secrecy = "0.8"
rand = "0.8.5"
getrandom = "=0.2.15"

# Serialization & data
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
uuid = { version = "1.6.1", features = ["v7", "serde"] }
thiserror = "1.0.61"
anyhow = "1.0.86"

# Storage
rusqlite = { version = "0.31.0", features = ["bundled", "chrono"] }
chrono = { version = "0.4.38", features = ["serde"] }

# CLI
clap = { version = "4.5.7", features = ["derive", "env"] }
clap_complete = "4.5.5"
arboard = "3.4.0"
directories = "5.0.1"
toml = "0.8.14"

# Logging
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

# Testing
tempfile = "3.10.1"
keyring = "3.6.1"
hex = "0.4.3"
subtle = "2.5.0"


[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
# Deny common footguns
unwrap_used = "allow"          # tests + early MVP; tighten later
expect_used = "allow"
panic = "allow"
todo = "warn"
dbg_macro = "warn"
